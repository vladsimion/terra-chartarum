# CI guardrail (KAN-14 / ATLAS-102, extended by KAN-176, VMN-21 and KAN-303).
# Runs on every PR and on pushes to main. Data/build jobs validate the candidate;
# production-provenance then proves the canonical Pages origin serves that main SHA.
# Node is pinned via .node-version to match the Cloudflare Pages build (KAN-56).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, type-check, unit & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prettier format check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Astro type check
        run: npm run check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Shared contracts and cross-registry integrity
        run: npm run registries:validate
      - name: Geo release manifest and asset QA
        run: npm run geo:validate
      - name: Editorial package completeness
        run: npm run editorial:validate
      - name: Build (static output)
        run: npm run build

  e2e:
    name: E2E + accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (static output)
        run: npm run build
      - name: Run Lighthouse CI
        run: npx lhci autorun

  vmn-data:
    name: VMN dataset QA gate (spec §8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pyogrio + geometry dependencies
        run: pip install pyogrio numpy shapely
      - name: Validate compiled FGB artifacts
        run: python scripts/vmn/validate.py

  hanseatic-data:
    name: HSE promotion rules + dataset QA gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Promotion-rule tests
        run: python -m pytest scripts/hanseatic -q
      - name: Validate sources and generated assets
        run: python scripts/hanseatic/validate.py

  production-provenance:
    name: Verify canonical production origin
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, e2e, lighthouse, vmn-data, hanseatic-data]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://terra-chartarum.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify Cloudflare Pages origin serves this SHA
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          PRODUCTION_ORIGIN: https://terra-chartarum.pages.dev
          PRODUCTION_VERIFY_RETRIES: '20'
          PRODUCTION_VERIFY_DELAY_MS: '15000'
        run: node scripts/verify-production.mjs
