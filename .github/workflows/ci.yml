# CI guardrail (KAN-14 / ATLAS-102, extended by KAN-176, VMN-21 and KAN-303).
# Runs on every PR and on pushes to main. Five parallel jobs:
#   verify - format, lint, type-check, unit tests, build (fast gate)
#   e2e    - Playwright smoke + axe accessibility budget over the built site
#   lighthouse - Lighthouse CI (accessibility budget hard, perf/bp/seo as warnings)
#   vmn-data - VMN dataset QA gate: validates the compiled FGB artifacts (spec §8)
#   hanseatic-data - HSE promotion-rule tests + the sources/outputs QA gate
# Node is pinned via .node-version to match the Cloudflare Pages build (KAN-56).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, type-check, unit & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Astro type check
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm test

      - name: Geo release manifest and asset QA
        run: npm run geo:validate

      - name: Editorial package completeness
        run: npm run editorial:validate

      - name: Build (static output)
        run: npm run build

  e2e:
    name: E2E + accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # All engines: cross-browser / responsive QA runs core flows on
        # Chromium, Firefox and WebKit (mobile projects reuse these engines).
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        # The Playwright config builds and previews dist/ itself via webServer.
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static output)
        run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun

  vmn-data:
    name: VMN dataset QA gate (spec §8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyogrio + geometry dependencies
        # KAN-208: Shapely is an explicit runtime dependency of the route and
        # coastline checks; keep this aligned with `make vmn-venv`.
        # pyogrio ships a manylinux wheel bundling GDAL, so no system GDAL/PROJ.
        run: pip install pyogrio numpy shapely

      - name: Validate compiled FGB artifacts
        run: python scripts/vmn/validate.py

  hanseatic-data:
    name: HSE promotion rules + dataset QA gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        # KAN-303: the HSE compiler is standard-library only by design, so
        # pytest is the single test-time dependency. Deliberately not the VMN
        # venv - nothing here touches GDAL or geometry.
        run: pip install pytest

      - name: Promotion-rule tests
        # Guards the rules that stop unverified research being published as
        # verified. These fire only on data nobody has written yet, so they
        # would otherwise rot unnoticed between research phases.
        run: python -m pytest scripts/hanseatic -q

      - name: Validate sources and generated assets
        # Same gate as `npm run hanseatic:validate`, run here without Node so
        # it fails fast alongside the tests rather than only inside the build.
        run: python scripts/hanseatic/validate.py
