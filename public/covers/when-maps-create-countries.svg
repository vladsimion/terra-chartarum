<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">When Maps Create Countries</title>
  <desc id="desc">A territorial line is copied repeatedly until it becomes a familiar emblem.</desc>
  <rect width="1200" height="630" fill="#0a0806"/>
  <g fill="none" stroke="#a77c47">
    <path d="M160 110L350 70L470 180L430 360L250 430L100 300Z" stroke-width="3" opacity=".25"/>
    <path d="M290 95L480 55L600 165L560 345L380 415L230 285Z" stroke-width="5" opacity=".45"/>
    <path d="M420 80L610 40L730 150L690 330L510 400L360 270Z" stroke-width="8" opacity=".7"/>
    <path d="M550 65L740 25L860 135L820 315L640 385L490 255Z" stroke-width="12"/>
  </g>
  <text x="72" y="535" fill="#e8dec5" font-family="serif" font-size="54">When Maps Create Countries</text>
  <text x="76" y="578" fill="#a77c47" font-family="monospace" font-size="20" letter-spacing="5">THE LINE REHEARSED</text>
</svg>
