<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Projection and Perspective</title>
  <desc id="desc">A gridded globe opens into several flat projection contracts.</desc>
