<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Palimpsest Landscapes</title>
  <desc id="desc">Several partial surveys overlap without resolving into one final layer.</desc>
